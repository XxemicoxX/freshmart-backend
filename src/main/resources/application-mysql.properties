spring.datasource.url=${FRESHMART_DB_URL:jdbc:mysql://localhost:3306/freshmart?serverTimezone=America/Lima}
spring.datasource.username=${FRESHMART_DB_USER:root}
spring.datasource.password=${FRESHMART_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.sql.init.mode=never

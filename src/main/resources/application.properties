spring.application.name=freshmart
server.port=8080 

# --- MySQL (base creada con database/freshmart_mysql.sql en MySQL Workbench) ---
spring.datasource.url=${FRESHMART_DB_URL:jdbc:mysql://localhost:3306/freshmart?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${FRESHMART_DB_USER:root}
spring.datasource.password=${FRESHMART_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# El esquema lo crea el script SQL; Hibernate no lo modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.sql.init.mode=never

app.frontend-url=http://localhost:3000
app.igv-rate=0.18
app.jwt.secret=${FRESHMART_JWT_SECRET:FreshmartDevelopmentSecretKeyChangeBeforeProduction2026}
app.jwt.expiration-minutes=120
app.mail.enabled=false
app.mail.from=noreply@freshmart.local
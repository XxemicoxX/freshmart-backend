spring.application.name=freshmart
spring.datasource.url=jdbc:h2:mem:freshmart;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.sql.init.mode=always
app.frontend-url=http://localhost:3000
app.igv-rate=0.18
app.jwt.secret=FreshmartDevelopmentSecretKeyChangeBeforeProduction2026
app.jwt.expiration-minutes=120
app.mail.enabled=false
app.mail.from=noreply@freshmart.local
server.port=8081